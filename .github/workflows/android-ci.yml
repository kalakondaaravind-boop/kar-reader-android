name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleStandardDebug assembleSyncDebug 2>&1 | tee -a build-output.txt

      - name: Verify the standard build has no network permission
        run: |
          AAPT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)aapt
          STD=$(ls app/build/outputs/apk/standard/debug/*.apk)
          SYNC=$(ls app/build/outputs/apk/sync/debug/*.apk)
          echo "Standard build permissions:"; $AAPT dump permissions "$STD"
          echo "Sync build permissions:"; $AAPT dump permissions "$SYNC"
          if $AAPT dump permissions "$STD" | grep -E "android.permission.(INTERNET|ACCESS_NETWORK_STATE)"; then
            echo "::error::The standard (offline) build must not request network permissions"; exit 1
          fi
          $AAPT dump permissions "$SYNC" | grep -q "android.permission.INTERNET" || { echo "::error::Sync build is missing INTERNET"; exit 1; }

      - name: Unit tests
        run: ./gradlew testStandardDebugUnitTest 2>&1 | tee -a build-output.txt

      - name: Lint
        run: ./gradlew lintStandardDebug lintSyncDebug 2>&1 | tee -a build-output.txt

      - name: Report build errors as annotations
        if: failure()
        run: |
          # Surface compiler, lint and test failures as annotations so they are readable through the GitHub API.
          touch build-output.txt
          grep -E "^e: |: Error: |^\S+\.kt:[0-9]+: error|FAILED$|> Task .* FAILED|What went wrong|Caused by|expected:<|Exception" build-output.txt \
            | sed -E 's#file:///home/runner/work/[^/]+/[^/]+/##; s#/home/runner/work/[^/]+/[^/]+/##' \
            | awk '!seen[$0]++' | head -45 \
            | while IFS= read -r line; do
                msg="${line//'%'/'%25'}"; echo "::error::${msg:0:900}"
              done
          for f in app/build/reports/lint-results-*.txt; do
            [ -f "$f" ] && grep -E "Error:" "$f" | head -20 | while IFS= read -r line; do msg="${line//'%'/'%25'}"; echo "::error title=lint::${msg:0:900}"; done
          done
          for f in $(ls app/build/test-results/*/*.xml 2>/dev/null); do
            grep -o 'testcase name="[^"]*" classname="[^"]*"[^>]*>[[:space:]]*<failure message="[^"]*' "$f" | head -10 | while IFS= read -r line; do msg="${line//'%'/'%25'}"; echo "::error title=test::${msg:0:900}"; done
          done

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KAR-READER-debug-apk
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
