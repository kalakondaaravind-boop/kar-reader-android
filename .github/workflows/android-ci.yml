name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 'bash' (unlike the default) runs with -o pipefail, so `gradlew … | tee` fails when Gradle fails.
defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build, lint and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Cache speech engine and models
        uses: actions/cache@v4
        with:
          path: .speech-cache
          key: speech-${{ hashFiles('gradle/libs.versions.toml', 'scripts/fetch-speech-models.sh', 'scripts/speech-models.sha256') }}

      - name: Download speech engine and models
        run: ./scripts/fetch-speech-models.sh

      - name: Assemble debug APK
        run: ./gradlew assembleStandardDebug assembleSyncDebug 2>&1 | tee -a build-output.txt

      - name: Verify the standard build has no network permission
        run: |
          AAPT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)aapt
          STD=$(ls app/build/outputs/apk/standard/debug/*.apk)
          SYNC=$(ls app/build/outputs/apk/sync/debug/*.apk)
          echo "Standard build permissions:"; $AAPT dump permissions "$STD"
          echo "Sync build permissions:"; $AAPT dump permissions "$SYNC"
          if $AAPT dump permissions "$STD" | grep -E "android.permission.(INTERNET|ACCESS_NETWORK_STATE)"; then
            echo "::error::The standard (offline) build must not request network permissions"; exit 1
          fi
          $AAPT dump permissions "$SYNC" | grep -q "android.permission.INTERNET" || { echo "::error::Sync build is missing INTERNET"; exit 1; }

      - name: Unit tests
        run: ./gradlew testStandardDebugUnitTest 2>&1 | tee -a build-output.txt

      - name: Summarize tests and APK contents
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          total = fail = 0; suites = []
          for f in glob.glob('app/build/test-results/testStandardDebugUnitTest/*.xml'):
              r = ET.parse(f).getroot(); t = int(r.get('tests')); x = int(r.get('failures')) + int(r.get('errors')); s = int(r.get('skipped'))
              total += t; fail += x; suites.append(f"{r.get('name').split('.')[-1]} {t - x - s}/{t}")
              for case in r.iter('testcase'):
                  for bad in list(case.iter('failure')) + list(case.iter('error')):
                      detail = (bad.get('message') or '') + ' ' + (bad.text or '')[:700]
                      print(f"::error title=Failed {case.get('name')}::" + detail.replace('%', '%25').replace('\n', '%0A')[:1800])
          print(f"::notice title=Unit tests::{total} tests, {fail} failed: " + ", ".join(sorted(suites)))
          PY
          ls app/build/outputs/apk/*/debug/*.apk >/dev/null 2>&1 || exit 0
          for f in app/build/outputs/apk/*/debug/*.apk; do echo "::notice title=$(basename $f)::$(du -m "$f" | cut -f1) MB"; done
          BT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          "${BT}aapt" list -v app/build/outputs/apk/standard/debug/*.apk | awk '$NF ~ /^(assets\/models|lib\/)/ {printf "%s %.0f MB\n", $NF, $1/1048576}' | sort -k2 -n -r | head -12 \
            | while read -r line; do echo "::notice title=APK content::$line"; done

      - name: Lint
        run: ./gradlew lintStandardDebug lintSyncDebug 2>&1 | tee -a build-output.txt

      - name: Report build errors as annotations
        if: failure()
        run: |
          # Surface compiler, lint and test failures as annotations so they are readable through the GitHub API.
          touch build-output.txt
          grep -E "^e: |: Error: |^\S+\.kt:[0-9]+: error|FAILED$|> Task .* FAILED|What went wrong|Caused by|expected:<|Exception" build-output.txt \
            | sed -E 's#file:///home/runner/work/[^/]+/[^/]+/##; s#/home/runner/work/[^/]+/[^/]+/##' \
            | awk '!seen[$0]++' | head -45 \
            | while IFS= read -r line; do
                msg="${line//'%'/'%25'}"; echo "::error::${msg:0:900}"
              done
          for f in app/build/reports/lint-results-*.txt; do
            [ -f "$f" ] && grep -E "Error:" "$f" | head -20 | while IFS= read -r line; do msg="${line//'%'/'%25'}"; echo "::error title=lint::${msg:0:900}"; done
          done
          for f in $(ls app/build/test-results/*/*.xml 2>/dev/null); do
            grep -o 'testcase name="[^"]*" classname="[^"]*"[^>]*>[[:space:]]*<failure message="[^"]*' "$f" | head -10 | while IFS= read -r line; do msg="${line//'%'/'%25'}"; echo "::error title=test::${msg:0:900}"; done
          done

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KAR-READER-debug-apk
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

  device-test:
    name: Speech engine on an Android emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache speech engine and models
        uses: actions/cache@v4
        with:
          path: .speech-cache
          key: speech-test-${{ hashFiles('gradle/libs.versions.toml', 'scripts/fetch-speech-models.sh', 'scripts/speech-models.sha256') }}

      - name: Download speech engine, models and a test recording
        run: chmod +x gradlew scripts/*.sh && ./scripts/fetch-speech-models.sh --test-audio

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build test APKs (x86_64)
        run: ./gradlew assembleStandardDebug assembleStandardDebugAndroidTest -PkarAbis=x86_64 2>&1 | tee build-output.txt

      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            ./gradlew connectedStandardDebugAndroidTest -PkarAbis=x86_64 > device-test.txt 2>&1 || touch device-test-failed
            adb logcat -d -s KarSpeechTest:I > speech-report.txt || true
            adb logcat -d -b crash > crash-log.txt || true

      - name: Report results
        if: always()
        run: |
          sed -E 's/^.*KarSpeechTest: //' speech-report.txt 2>/dev/null | grep -v '^-----' | head -60 | while IFS= read -r line; do
            msg="${line//'%'/'%25'}"; echo "::notice title=Speech test::${msg:0:900}"
          done
          if [ -s crash-log.txt ]; then
            grep -v '^-----' crash-log.txt | head -40 | while IFS= read -r line; do msg="${line//'%'/'%25'}"; echo "::error title=Crash::${msg:0:900}"; done
          fi
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('app/build/outputs/androidTest-results/**/*.xml', recursive=True) + glob.glob('app/build/test-results/**/connected*/**/*.xml', recursive=True):
              r = ET.parse(f).getroot()
              print(f"::notice title=Device tests::{r.get('tests')} tests, {r.get('failures')} failures, {r.get('errors')} errors")
              for case in r.iter('testcase'):
                  for bad in list(case.iter('failure')) + list(case.iter('error')):
                      detail = (bad.get('message') or '') + ' ' + (bad.text or '')[:1500]
                      print(f"::error title=Failed {case.get('name')}::" + detail.replace('%', '%25').replace('\n', '%0A')[:3000])
          PY
          find app/build/outputs -path '*androidTest*' -name '*.xml' | head -5 | while read -r f; do echo "::notice title=Result file::$f"; done
          grep -E "^e: |What went wrong|FAILED|Exception|Error|expected|Tests on" build-output.txt device-test.txt 2>/dev/null | grep -v "^build-output.txt:.*warning" | awk '!seen[$0]++' | head -40 | while IFS= read -r line; do echo "::error::${line:0:900}"; done
          [ ! -f device-test-failed ]

