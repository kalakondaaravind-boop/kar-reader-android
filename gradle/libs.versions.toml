coreKtx = "1.16.0"
lifecycle = "2.9.1"
activityCompose = "1.10.1"
navigationCompose = "2.9.0"
composeBom = "2025.06.00"
room = "2.7.2"
datastore = "1.1.7"
coroutines = "1.10.2"
junit = "4.13.2"
orgJson = "20240303"
androidxTestExt = "1.2.1"
